[project]
name = "booking-coworking"
version = "0.1.0"
description = ""
authors = [
    {name = "Aidar",email = "aidar.sh1905@gmail.com"}
]
requires-python = ">=3.12"
package-mode = false
dependencies = [
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.0.1,<4.1.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "alembic (>=1.18.5,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
show_missing = true
